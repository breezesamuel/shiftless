version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: monetization-db
    environment:
      POSTGRES_USER: monetization
      POSTGRES_PASSWORD: monetization_dev
      POSTGRES_DB: monetization
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monetization"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monetization-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: monetization-api
    environment:
      DATABASE_URL: postgresql://monetization:monetization_dev@postgres:5432/monetization
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: dev-secret-change-in-production
      X402_NETWORK: eip155:84532
      X402_FACILITATOR_URL: https://x402.org/facilitator
      X402_PAY_TO: 0x12A2b19eFA9D8BC48ac156Cc8FdfC7cC0Dff36aB
      X402_DEFAULT_PRICE: 0.10 USD
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: monetization-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data: